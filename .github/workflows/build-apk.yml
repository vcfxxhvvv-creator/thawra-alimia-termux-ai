name: Build APK
on:
  push: {branches: [main, terminal-v2-buildtime]}
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-optional 2>&1 | tail -30
      - name: Download Termux FFmpeg (optional)
        run: |
          mkdir -p bootstrap/usr/bin
          curl -sL --max-time 20 -o ffmpeg.deb https://packages.termux.dev/apt/termux-main/pool/main/f/ffmpeg/ffmpeg_7.0.2_aarch64.deb 2>/dev/null || echo 'FFmpeg download skipped'
          if [ -s ffmpeg.deb ]; then
            ar x ffmpeg.deb data.tar.xz 2>/dev/null || ar x ffmpeg.deb data.tar.gz 2>/dev/null || true
            tar -xf data.tar.* -C bootstrap/ 2>/dev/null || true
            FFBIN=$(find bootstrap/ -name ffmpeg -type f 2>/dev/null | head -1)
            if [ -n "$FFBIN" ]; then cp "$FFBIN" bootstrap/usr/bin/; echo 'FFmpeg extracted'; fi
          fi
          echo 'FFmpeg step complete (optional)'
      - name: Integrate FFmpeg into assets
        run: |
          mkdir -p android/app/src/main/assets/termux
          if [ -f bootstrap/usr/bin/ffmpeg ]; then
            cp bootstrap/usr/bin/ffmpeg android/app/src/main/assets/termux/
            chmod +x android/app/src/main/assets/termux/ffmpeg
            echo 'FFmpeg integrated'
          else
            echo 'No FFmpeg binary - continuing without it'
          fi
      - name: Install EAS CLI
        run: npm install -g eas-cli@latest
      - name: Build APK
        run: |
          eas build --platform android --profile preview --non-interactive --local --output thawra.apk 2>&1 | tail -30 || \
          eas build --platform android --profile preview --non-interactive 2>&1 | tail -30
      - id: findapk
        run: |
          APK=$(find . -name '*.apk' -type f 2>/dev/null | head -1)
          echo "apk=$APK" >> $GITHUB_OUTPUT
          echo "Found: $APK"
      - uses: actions/upload-artifact@v4
        if: steps.findapk.outputs.apk != ''
        with:
          name: thawra-alimia-apk
          path: ${{ steps.findapk.outputs.apk }}
          retention-days: 30

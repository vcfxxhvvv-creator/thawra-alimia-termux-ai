name: Build Terminal Assets
on:
  push:
    branches: [main, terminal-v2-buildtime]
    paths:
      - '.github/workflows/build-terminal-assets.yml'
      - 'terminal-build/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_PACKAGE: com.thawra.termux.ai
  API_LEVEL: 24
  ALPINE_VERSION: "3.20.3"
  ALPINE_BRANCH: "v3.20"
  TALLOC_VERSION: "2.4.3"
  LIBANDROID_SHMEM_VERSION: "0.7"

jobs:
  build-terminal-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Locate Android NDK
        id: ndk
        run: |
          # GitHub-hosted ubuntu-latest runners ship a preinstalled NDK.
          if [ -n "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "path=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_OUTPUT"
          elif [ -n "$ANDROID_NDK_HOME" ]; then
            echo "path=$ANDROID_NDK_HOME" >> "$GITHUB_OUTPUT"
          else
            echo "No preinstalled NDK found, installing via sdkmanager..."
            yes | sdkmanager --install "ndk;26.3.11579264"
            echo "path=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_OUTPUT"
          fi
      - name: Show NDK version
        run: |
          echo "NDK at: ${{ steps.ndk.outputs.path }}"
          ls "${{ steps.ndk.outputs.path }}" || true

      - name: Set up cross-compiler env
        id: cc
        run: |
          NDK="${{ steps.ndk.outputs.path }}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          echo "toolchain=$TOOLCHAIN" >> "$GITHUB_OUTPUT"

          # proot's GNUmakefile calls bare `objdump`/`objcopy` (no llvm-
          # prefix, no path) in a couple of places to repackage the loader.
          # Left alone, those resolve to the HOST's x86_64 GNU binutils,
          # which can't make sense of an aarch64-android object file
          # ("architecture UNKNOWN"). Shadow them with wrappers pointing
          # at the NDK's LLVM tools, placed first in PATH.
          mkdir -p "$HOME/ndk-shims"
          ln -sf "$TOOLCHAIN/bin/llvm-objcopy" "$HOME/ndk-shims/objcopy"
          ln -sf "$TOOLCHAIN/bin/llvm-objdump" "$HOME/ndk-shims/objdump"
          ln -sf "$TOOLCHAIN/bin/llvm-ar"      "$HOME/ndk-shims/ar"
          ln -sf "$TOOLCHAIN/bin/llvm-strip"   "$HOME/ndk-shims/strip"
          ln -sf "$TOOLCHAIN/bin/llvm-ranlib"  "$HOME/ndk-shims/ranlib"
          echo "$HOME/ndk-shims" >> "$GITHUB_PATH"
          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"
          {
            echo "CC=$TOOLCHAIN/bin/aarch64-linux-android${API_LEVEL}-clang"
            echo "AR=$TOOLCHAIN/bin/llvm-ar"
            echo "STRIP=$TOOLCHAIN/bin/llvm-strip"
            echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib"
            echo "SYSROOT=$TOOLCHAIN/sysroot"
          } >> "$GITHUB_ENV"

      - name: Verify cross-compiler works
        run: |
          echo 'int main(){return 0;}' > /tmp/t.c
          "$CC" /tmp/t.c -o /tmp/t && echo "cross-compiler OK: $CC"

      # ---------------------------------------------------------------
      # talloc: proot's only hard dependency. Recipe below matches what
      # termux-packages actually uses (packages/libtalloc/build.sh) -
      # same source, same cross-answers file for talloc's waf-based
      # configure (can't run target-arch test binaries on the host
      # during cross-compilation, so waf needs precomputed answers).
      # ---------------------------------------------------------------
      - name: Build talloc (static)
        id: talloc
        run: |
          set -e
          mkdir -p build/talloc && cd build/talloc
          curl -sL "https://www.samba.org/ftp/talloc/talloc-${TALLOC_VERSION}.tar.gz" -o talloc.tar.gz
          tar xzf talloc.tar.gz --strip-components=1

          cat > cross-answers.txt << 'EOF'
          Checking uname sysname type: "Linux"
          Checking uname machine type: "dontcare"
          Checking uname release type: "dontcare"
          Checking uname version type: "dontcare"
          Checking simple C program: OK
          building library support: OK
          Checking for large file support: OK
          Checking for -D_FILE_OFFSET_BITS=64: OK
          Checking for WORDS_BIGENDIAN: OK
          Checking for C99 vsnprintf: OK
          Checking for HAVE_SECURE_MKSTEMP: OK
          rpath library support: OK
          -Wl,--version-script support: FAIL
          Checking correct behavior of strtoll: OK
          Checking correct behavior of strptime: OK
          Checking for HAVE_IFACE_GETIFADDRS: OK
          Checking for HAVE_IFACE_IFCONF: OK
          Checking for HAVE_IFACE_IFREQ: OK
          Checking getconf LFS_CFLAGS: OK
          Checking for large file support without additional flags: OK
          Checking for working strptime: OK
          Checking for HAVE_SHARED_MMAP: OK
          Checking for HAVE_MREMAP: OK
          Checking for HAVE_INCOHERENT_MMAP: OK
          Checking getconf large file support flags work: OK
          EOF

          PREFIX="$GITHUB_WORKSPACE/build/sysroot"
          mkdir -p "$PREFIX"
          CC="$CC" ./configure --prefix="$PREFIX" \
            --disable-rpath --disable-python \
            --cross-compile --cross-answers=cross-answers.txt

          make -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/talloc-build.log"

          # Static reconstruction from waf's fragmented, duplicated .o
          # outputs proved unreliable across several attempts (verified-
          # correct object selection still left proot's link short of
          # symbols, a different set each time). waf already builds a
          # complete, working libtalloc.so every run without any of this
          # guessing - use that directly via dynamic linking instead.
          # (TerminalModule.kt sets LD_LIBRARY_PATH at runtime so proot's
          # dynamic linker can find it next to the other jniLibs.)
          mkdir -p "$PREFIX/lib" "$PREFIX/include"
          SOFILE=$(find . -name "libtalloc.so" | head -1)
          if [ -z "$SOFILE" ]; then
            echo "ERROR: waf did not produce libtalloc.so"
            exit 1
          fi
          cp "$SOFILE" "$PREFIX/lib/libtalloc.so"

          echo "--- soname before patch ---"
          llvm-readelf -d "$PREFIX/lib/libtalloc.so" | grep -i soname || echo "(no SONAME entry)"
          # Android's jniLibs packaging requires the literal filename
          # lib*.so - a versioned soname (e.g. libtalloc.so.2, which is
          # typical for samba/talloc releases) wouldn't qualify, and would
          # also mean proot's own DT_NEEDED wouldn't match our jniLib
          # filename at runtime. Force it to plain libtalloc.so before
          # proot links against it, so both sides agree.
          which patchelf || (sudo apt-get update -qq && sudo apt-get install -y -qq patchelf)
          patchelf --set-soname libtalloc.so "$PREFIX/lib/libtalloc.so"
          echo "--- soname after patch ---"
          llvm-readelf -d "$PREFIX/lib/libtalloc.so" | grep -i soname

          echo "--- verifying canary symbol is present in the .so ---"
          llvm-nm -D "$PREFIX/lib/libtalloc.so" | grep " T talloc_report_depth_cb$"

          find "$GITHUB_WORKSPACE/build/talloc" -maxdepth 1 -name "talloc.h" -exec cp {} "$PREFIX/include/" \;
          echo "talloc built: $(ls -la $PREFIX/lib/libtalloc.so)"

      # ---------------------------------------------------------------
      # libandroid-shmem: optional (PROOT_WITH_LIBANDROID_SHMEM). Best
      # effort - proot can build without it, just with SysV shm support
      # emulated slightly differently. Not blocking if this step fails.
      # ---------------------------------------------------------------
      - name: Build libandroid-shmem (best effort)
        id: shmem
        continue-on-error: true
        run: |
          set -e
          mkdir -p build/shmem && cd build/shmem
          curl -sL "https://github.com/termux/libandroid-shmem/archive/refs/tags/v${LIBANDROID_SHMEM_VERSION}.tar.gz" -o shmem.tar.gz
          tar xzf shmem.tar.gz --strip-components=1
          PREFIX="$GITHUB_WORKSPACE/build/sysroot"
          "$CC" -c ashmem.c -o ashmem.o -I.
          "$CC" -c sys_shm_ashmem.c -o sys_shm_ashmem.o -I. 2>/dev/null || true
          "$AR" rcs libandroid-shmem.a *.o
          cp libandroid-shmem.a "$PREFIX/lib/" 2>/dev/null || true
          cp android-shmem.h "$PREFIX/include/" 2>/dev/null || true
          echo "libandroid-shmem: best-effort build attempted"

      # ---------------------------------------------------------------
      # proot itself. Real upstream source (termux's Android-patched
      # fork), built with its own GNUmakefile - no termux-packages
      # wrapper needed since the rootfs path is a runtime argument
      # (-r), not something baked in at compile time.
      # ---------------------------------------------------------------
      - name: Build proot
        id: proot
        run: |
          set -e
          git clone --depth 1 https://github.com/termux/proot.git build/proot-src

          # NDK 29's clang treats implicit function declarations as a hard
          # error (older toolchains only warned). This file uses strcmp()/
          # memset() without including string.h - real bug, one-line fix.
          sed -i '1i #include <string.h>' \
            build/proot-src/src/extension/ashmem_memfd/ashmem_memfd.c

          # proot's OBJIFY macro shells out to `objdump -f` and greps for
          # "file format"/"architecture" lines to auto-detect the target
          # for objcopy. llvm-objdump's -f output doesn't match the text
          # format that grep/awk expects (written for GNU binutils), so
          # the detected values come out empty -> "architecture UNKNOWN".
          # We always know the exact target here, so replace the fragile
          # shell auto-detection with a plain Make conditional on $@
          # (loader-m32 needs elf32-littlearm/arm, the normal loader
          # needs elf64-littleaarch64/aarch64).
          python3 terminal-build/patch_proot_makefile.py build/proot-src/src/GNUmakefile

          cd build/proot-src/src
          PREFIX="$GITHUB_WORKSPACE/build/sysroot"

          SHMEM_FLAG=""
          SHMEM_LDFLAG=""
          if [ -f "$PREFIX/lib/libandroid-shmem.a" ]; then
            SHMEM_FLAG="PROOT_WITH_LIBANDROID_SHMEM=1"
            SHMEM_LDFLAG="-landroid-shmem"
          fi

          # IMPORTANT: confirmed via the actual link command in a previous
          # run's log that -ltalloc was NEVER present, despite proot's own
          # GNUmakefile having `LDFLAGS += -ltalloc -Wl,-z,noexecstack`.
          # Root cause: GNU Make command-line variable assignments
          # (LDFLAGS=... passed to `make`) completely override a
          # makefile's own `+=` for that variable rather than combining
          # with it - so every previous LDFLAGS="-L$PREFIX/lib" silently
          # discarded the makefile's own addition. Every earlier attempt
          # to fix "missing talloc symbols" by changing what's IN
          # libtalloc was chasing a red herring: it was never being
          # linked against at all. Build the complete LDFLAGS ourselves
          # instead of relying on += to add to it.
          FULL_LDFLAGS="-L$PREFIX/lib -ltalloc $SHMEM_LDFLAG -Wl,-z,noexecstack"

          # .DEFAULT_GOAL in proot's GNUmakefile is `proot`, which already
          # pulls in the loader as an order-only prerequisite - no need to
          # (wrongly) name loader targets explicitly like the first attempt did.
          set +e
          make -j"$(nproc)" \
            CC="$CC" \
            CFLAGS="-O2 -I$PREFIX/include" \
            LDFLAGS="$FULL_LDFLAGS" \
            $SHMEM_FLAG \
            V=1 2>&1 | tee "$GITHUB_WORKSPACE/proot-build.log"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "proot build failed with status $BUILD_STATUS"
            exit 1
          fi

          ls -la proot
          "$STRIP" proot || true
          file proot

      - name: Save build log on failure
        if: failure()
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p ci-debug
          cp proot-build.log ci-debug/proot-build.log 2>/dev/null || echo "no log captured" > ci-debug/proot-build.log
          cp talloc-build.log ci-debug/talloc-build.log 2>/dev/null || echo "no log captured" > ci-debug/talloc-build.log
          git config user.email "ci@local"
          git config user.name "terminal-assets-ci"
          git add -f ci-debug/proot-build.log ci-debug/talloc-build.log
          git commit -m "ci: capture failed build logs [skip ci]"
          git push origin HEAD:main

      - name: Build termux-core (termux-exec's header dependency)
        id: termuxcore
        continue-on-error: true
        run: |
          set +e
          # termux-exec-package's build hardcodes include paths under
          # /data/data/$(APP_PACKAGE)/files/usr - the real on-device
          # runtime path, not a neutral build sysroot (this is how
          # Termux's own build system normally works: built inside a
          # container that already mirrors the final device layout).
          # Create that real path on the runner and install termux-core
          # there for real, so termux-exec's hardcoded -I path resolves.
          REAL_PREFIX="/data/data/$APP_PACKAGE/files/usr"
          sudo mkdir -p "$REAL_PREFIX"
          sudo chown -R "$(whoami)" "/data"

          # termux-core-package's Makefile requires
          # TERMUX_PKGS__BUILD__REPO_ROOT_DIR pointing at a checkout of
          # the main termux-packages monorepo (for
          # packages/termux-core/build/scripts/termux-replace-termux-core-src-scripts).
          # Sparse-checkout just that one path instead of the whole repo.
          git clone --filter=blob:none --no-checkout --depth 1 \
            https://github.com/termux/termux-packages.git build/termux-packages-repo
          cd build/termux-packages-repo
          git sparse-checkout set packages/termux-core
          git checkout
          cd "$GITHUB_WORKSPACE"

          git clone --depth 1 https://github.com/termux/termux-core-package.git build/termux-core-src
          cd build/termux-core-src
          # NOTE: explicitly passing CC here. termux-exec's build correctly
          # inherited $CC from the environment (confirmed in its log), but
          # termux-core's first attempt silently fell back to the HOST's
          # x86_64 gcc ("is incompatible with elf64-x86-64", and "collect2"
          # in the error is a GCC-specific driver, not clang) - its
          # Makefile most likely has its own plain CC assignment that
          # overrides an inherited env var. Command-line args beat
          # everything, so passing CC explicitly here is the reliable fix.
          make -j"$(nproc)" \
            CC="$CC" \
            TERMUX_APP__NAME="Thawra Alimia" \
            TERMUX_APP__PACKAGE_NAME="$APP_PACKAGE" \
            TERMUX_PKGS__BUILD__REPO_ROOT_DIR="$GITHUB_WORKSPACE/build/termux-packages-repo" \
            all 2>&1 | tee "$GITHUB_WORKSPACE/termux-core-build.log"
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ "$BUILD_STATUS" -eq 0 ]; then
            make CC="$CC" TERMUX_APP__PACKAGE_NAME="$APP_PACKAGE" \
              TERMUX_PKGS__BUILD__REPO_ROOT_DIR="$GITHUB_WORKSPACE/build/termux-packages-repo" \
              install 2>&1 | tee -a "$GITHUB_WORKSPACE/termux-core-build.log"
          fi
          echo "--- what actually landed under $REAL_PREFIX ---"
          find "$REAL_PREFIX" -type f 2>&1 | tee -a "$GITHUB_WORKSPACE/termux-core-build.log"
          set -e
          echo "status=$BUILD_STATUS" >> "$GITHUB_OUTPUT"

      - name: Save termux-core build log
        if: always()
        run: |
          mkdir -p ci-debug
          cp termux-core-build.log ci-debug/termux-core-build.log 2>/dev/null || echo "no log captured" > ci-debug/termux-core-build.log
          git config user.email "ci@local"
          git config user.name "terminal-assets-ci"
          git add -f ci-debug/termux-core-build.log
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "ci: capture termux-core build log [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Build termux-exec
        id: termuxexec
        continue-on-error: true
        run: |
          set +e
          git clone --depth 1 https://github.com/termux/termux-exec-package.git build/termux-exec-src
          cd build/termux-exec-src
          REAL_PREFIX="/data/data/$APP_PACKAGE/files/usr"

          make -j"$(nproc)" \
            TERMUX_APP__NAME="Thawra Alimia" \
            TERMUX_APP__PACKAGE_NAME="$APP_PACKAGE" \
            all 2>&1 | tee "$GITHUB_WORKSPACE/termux-exec-build.log"
          BUILD_STATUS=${PIPESTATUS[0]}
          echo "termux-exec build status: $BUILD_STATUS"

          if [ "$BUILD_STATUS" -eq 0 ]; then
            make TERMUX_APP__PACKAGE_NAME="$APP_PACKAGE" \
              install 2>&1 | tee -a "$GITHUB_WORKSPACE/termux-exec-build.log"
            echo "--- install dir contents ---"
            find "$REAL_PREFIX" -name "*termux-exec*" -o -name "*.so" 2>/dev/null | tee -a "$GITHUB_WORKSPACE/termux-exec-build.log"
          fi
          set -e
          echo "status=$BUILD_STATUS" >> "$GITHUB_OUTPUT"

      - name: Save termux-exec build log
        if: always()
        run: |
          mkdir -p ci-debug
          cp termux-exec-build.log ci-debug/termux-exec-build.log 2>/dev/null || echo "no log captured" > ci-debug/termux-exec-build.log
          git config user.email "ci@local"
          git config user.name "terminal-assets-ci"
          git add -f ci-debug/termux-exec-build.log
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "ci: capture termux-exec build log [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Collect proot into jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp build/proot-src/src/proot android/app/src/main/jniLibs/arm64-v8a/libproot.so
          cp build/sysroot/lib/libtalloc.so android/app/src/main/jniLibs/arm64-v8a/libtalloc.so

          TERMUXEXEC_SO=$(find "/data/data/$APP_PACKAGE/files/usr" -name "libtermux-exec.so" 2>/dev/null | head -1)
          if [ -z "$TERMUXEXEC_SO" ]; then
            TERMUXEXEC_SO=$(find "/data/data/$APP_PACKAGE/files/usr" -name "libtermux-exec*.so" 2>/dev/null | head -1)
          fi
          if [ -n "$TERMUXEXEC_SO" ]; then
            cp "$TERMUXEXEC_SO" android/app/src/main/jniLibs/arm64-v8a/libtermuxexec.so
            echo "bundled termux-exec from: $TERMUXEXEC_SO"
          else
            echo "termux-exec build did not produce a usable .so - shipping without it (TerminalModule already degrades gracefully)"
          fi

          chmod +x android/app/src/main/jniLibs/arm64-v8a/*.so
          echo "--- jniLibs/arm64-v8a ---"
          ls -la android/app/src/main/jniLibs/arm64-v8a/
          echo "--- proot's dynamic dependencies ---"
          llvm-readelf -d android/app/src/main/jniLibs/arm64-v8a/libproot.so | grep -i needed

      # ---------------------------------------------------------------
      # Alpine minirootfs: official, unmodified, from alpinelinux.org.
      # This is just data (no compilation), bundled as an asset and
      # extracted by the app on first run (see AssetInstaller.kt).
      # ---------------------------------------------------------------
      - name: Download Alpine minirootfs
        run: |
          set -e
          mkdir -p assets/proot-dist
          URL="https://dl-cdn.alpinelinux.org/alpine/${ALPINE_BRANCH}/releases/aarch64/alpine-minirootfs-${ALPINE_VERSION}-aarch64.tar.gz"
          echo "Fetching $URL"
          curl -sL "$URL" -o assets/proot-dist/alpine-minirootfs.tar.gz
          ls -la assets/proot-dist/
          # sanity check it's a real gzip tarball, not an HTML error page
          file assets/proot-dist/alpine-minirootfs.tar.gz | grep -qi gzip

      - name: Upload terminal assets as artifact (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: terminal-assets-debug
          path: |
            android/app/src/main/jniLibs/
            assets/proot-dist/
          retention-days: 14

      - name: Commit assets back to repo
        run: |
          git config user.email "ci@local"
          git config user.name "terminal-assets-ci"
          git add -f android/app/src/main/jniLibs/ assets/proot-dist/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "ci: rebuild terminal assets (proot + alpine rootfs) [skip ci]"
          git push
